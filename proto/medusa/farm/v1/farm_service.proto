syntax = "proto3";

package medusa.farm.v1;

option java_multiple_files = true;

option java_package = "software.medusa.farm.v1";

service FarmService {
  rpc ListFibonacci(ListFibonacciRequest) returns (ListFibonacciResponse);
  rpc StartFibonacci(StartFibonacciRequest) returns (StartFibonacciResponse);
  rpc LinkOrg(LinkOrgRequest) returns (LinkOrgResponse);
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
}

message ListFibonacciRequest {}

message ListFibonacciResponse {
  repeated FibonacciNumber numbers = 1;
}

message FibonacciNumber {
  int32 index = 1;
  string value = 2;
}

message StartFibonacciRequest {
  int32 through = 1;
}

message StartFibonacciResponse {
  string workflow_id = 1;
}

message LinkOrgRequest {
  string org_login = 1;
}

message LinkOrgResponse {
  int64 installation_id = 1;
  repeated string repositories = 2;
}

message ListRepositoriesRequest {}

message ListRepositoriesResponse {
  repeated Repository repositories = 1;
}

message Repository {
  string org_login = 1;
  string full_name = 2;
  repeated Issue recent_issues = 3;
}

message Issue {
  int32 number = 1;
  string title = 2;
}
