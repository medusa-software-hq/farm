syntax = "proto3";

package medusa.farm.v1;

option java_multiple_files = true;

option java_package = "software.medusa.farm.v1";

service FarmService {
  rpc GetCount(GetCountRequest) returns (GetCountResponse);
  rpc Increment(IncrementRequest) returns (IncrementResponse);
  rpc Decrement(DecrementRequest) returns (DecrementResponse);
  rpc ListFibonacci(ListFibonacciRequest) returns (ListFibonacciResponse);
}

message GetCountRequest {}

message GetCountResponse {
  int32 count = 1;
}

message IncrementRequest {}

message IncrementResponse {
  int32 count = 1;
}

message DecrementRequest {}

message DecrementResponse {
  int32 count = 1;
}

message ListFibonacciRequest {}

message ListFibonacciResponse {
  repeated FibonacciNumber numbers = 1;
}

message FibonacciNumber {
  int32 index = 1;
  string value = 2;
}
