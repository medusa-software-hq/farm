syntax = "proto3";

package medusa.farm.v1;

option java_multiple_files = true;

option java_package = "software.medusa.farm.v1";

service FarmService {
  rpc LinkOrg(LinkOrgRequest) returns (LinkOrgResponse);
  rpc ListLinkedOrgs(ListLinkedOrgsRequest) returns (ListLinkedOrgsResponse);
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  rpc ListIssues(ListIssuesRequest) returns (ListIssuesResponse);
  rpc SyncRepositories(SyncRepositoriesRequest) returns (SyncRepositoriesResponse);
}

message LinkOrgRequest {
  string org_login = 1;
}

message LinkOrgResponse {
  int64 installation_id = 1;
  repeated string repositories = 2;
}

message ListLinkedOrgsRequest {}

message ListLinkedOrgsResponse {
  repeated LinkedOrg orgs = 1;
}

message LinkedOrg {
  string org_login = 1;
  int64 installation_id = 2;
}

message ListRepositoriesRequest {}

message ListRepositoriesResponse {
  repeated Repository repositories = 1;
}

message Repository {
  string org_login = 1;
  string full_name = 2;
}

message ListIssuesRequest {}

message ListIssuesResponse {
  repeated Issue issues = 1;
}

message Issue {
  string repo_full_name = 1;
  int32 number = 2;
  string title = 3;
}

message SyncRepositoriesRequest {}

message SyncRepositoriesResponse {}
