syntax = "proto3";

package medusa.farm.v1;

option java_multiple_files = true;

option java_package = "software.medusa.farm.v1";

service FarmService {
  rpc LinkOrg(LinkOrgRequest) returns (LinkOrgResponse);
  rpc ListLinkedOrgs(ListLinkedOrgsRequest) returns (ListLinkedOrgsResponse);
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  rpc ListIssues(ListIssuesRequest) returns (ListIssuesResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc GetSessionRuns(GetSessionRunsRequest) returns (GetSessionRunsResponse);
  rpc SyncRepositories(SyncRepositoriesRequest) returns (SyncRepositoriesResponse);
}

message LinkOrgRequest {
  string org_login = 1;
}

message LinkOrgResponse {
  int64 installation_id = 1;
  repeated string repositories = 2;
}

message ListLinkedOrgsRequest {}

message ListLinkedOrgsResponse {
  repeated LinkedOrg orgs = 1;
}

message LinkedOrg {
  string org_login = 1;
  int64 installation_id = 2;
}

message ListRepositoriesRequest {}

message ListRepositoriesResponse {
  repeated Repository repositories = 1;
}

message Repository {
  string org_login = 1;
  string full_name = 2;
}

message ListIssuesRequest {}

message ListIssuesResponse {
  repeated Issue issues = 1;
}

message Issue {
  string repo_full_name = 1;
  int32 number = 2;
  string title = 3;
  // Latest processing session state: "", "RUNNING", "AWAITING_REVIEW", "COMPLETED", or "FAILED".
  string session_state = 4;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message GetSessionRequest {
  string id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

// One run of the Farm agent against an issue. Self-describing: it carries the issue's repo, number,
// and title as they were when the session ran.
message Session {
  string id = 1;
  string repo_full_name = 2;
  int32 number = 3;
  string title = 4;
  // "RUNNING" (Farm is working), "AWAITING_REVIEW" (the pull request is open and the next move is a
  // person's), "COMPLETED", or "FAILED". A string rather than an enum: proto enums do not survive
  // the frontend's erasableSyntaxOnly.
  string state = 5;
  int64 started_at_millis = 6;
  // 0 until the session ends, which neither RUNNING nor AWAITING_REVIEW has done.
  int64 finished_at_millis = 7;
  // The pull request the run opened, or empty if it opened none.
  string pull_request_url = 8;
}

message GetSessionRunsRequest {
  string session_id = 1;
}

message GetSessionRunsResponse {
  repeated SessionRun runs = 1;
}

// One run within a session: ordinal 0 is the initial attempt, 1+ are fixup runs. A run holds one
// attempt per try at it; there is more than one only where a try was retried.
message SessionRun {
  int32 ordinal = 1;
  repeated SessionRunAttempt attempts = 2;
}

// One try at a run, numbered as the workflow's own activity attempt so the two can be lined up.
message SessionRunAttempt {
  int32 number = 1;
  // "RUNNING" (the latest try, still under way), "ABANDONED" (stopped without closing and was
  // retried; kept for reading back what it got to), or "FINISHED".
  string state = 2;
  int64 started_at_millis = 3;
  // What the try did, in the order it happened. Grows while the try is RUNNING.
  repeated AgentRunEntry entries = 4;
  // Set only when state is FINISHED.
  SessionRunAttemptOutcome outcome = 5;
}

message SessionRunAttemptOutcome {
  // "SUCCEEDED" or "ERRORED".
  string outcome = 1;
  string summary = 2;
  // Absent when the agent's backend reported no cost.
  AgentRunCost cost = 3;
}

message AgentRunCost {
  double usd = 1;
  int32 turns = 2;
  int64 duration_ms = 3;
}

// One thing that happened during a try.
message AgentRunEntry {
  oneof entry {
    AgentStep step = 1;
    // Something the agent's backend said outside its account of the work.
    string warning = 2;
  }
}

message AgentStep {
  string text = 1;
  repeated AgentToolAction tool_actions = 2;
}

// A tool action, classified into the closed set worth showing. Each carries the one string that
// says what it acted on; other_tool is the escape hatch for the open tail, and carries its name.
message AgentToolAction {
  oneof action {
    string edited_path = 1;
    string read_path = 2;
    string command = 3;
    string query = 4;
    string other_tool = 5;
  }
}

message SyncRepositoriesRequest {}

message SyncRepositoriesResponse {}
