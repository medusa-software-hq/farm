version: '3'

.kotlinSources: &kotlinSources
  - '**/*.kt'
  - '**/*.kts'

# Formatting/lint/compile/test are the whole-build `gradleRoot:*` tasks (root Taskfile) — this file
# keeps only what's specific to the CLI: building and running the installed binary.
tasks:
  install:
    desc: Install the CLI locally (build/install/cli/bin/cli)
    sources: *kotlinSources
    generates:
      - ./build/install/cli/bin/cli
    cmds:
      - ../gradlew installDist

  run:
    desc: Run the locally-installed CLI (pass args after --)
    deps: [install]
    cmds:
      - ./bin/ms-farm {{.CLI_ARGS}}
    interactive: true
