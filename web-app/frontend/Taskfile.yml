# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  install:
    desc: Install dependencies
    # Depended on by many tasks (often via `proto`); `once` avoids concurrent `yarn install` runs
    # racing on node_modules (EEXIST on the `.bin` symlinks).
    run: once
    sources:
      - package.json
      - yarn.lock
    generates:
      - node_modules/.yarn-state.yml
    cmds:
      # Using `--immutable` ensures a clean install based on the lockfile
      - yarn install --immutable

  proto:
    desc: Generate code from protobuf definitions
    run: once
    deps: [install]
    sources:
      - ../../proto/**/*.proto
    generates:
      - src/gen/**/*.ts
    cmds:
      - buf generate

  checkFormatting:
    desc: Check package formatting
    deps: [install]
    cmds:
      - npx oxfmt --check "**/*.{ts,tsx,css}"

  fixFormatting:
    desc: Fix package formatting
    deps: [install]
    cmds:
      - npx oxfmt --write "**/*.{ts,tsx,css}"

  lint:
    desc: Lint the package
    deps: [install, proto]
    cmds:
      - npx oxlint
      - npx stylelint '**/*.css' --cache

  typecheck:
    desc: Type check the package
    deps: [install, proto]
    cmds:
      # Each project by name. The root tsconfig only holds references, and `tsc` against it checks
      # no files at all rather than following them — it passes without having looked at anything.
      - npx tsc -p tsconfig.app.json
      - npx tsc -p tsconfig.node.json

  test:
    desc: Run unit tests
    deps: [install, proto]
    cmds:
      - npx vitest run

  clean:
    desc: Remove generated and build artifacts
    cmds:
      - rm -rf dist src/gen

  build:
    desc: Build the package
    deps: [install, typecheck, proto]
    cmds:
      - npx vite build

  dev:
    desc: Start dev server
    deps: [install, proto]
    env:
      VITE_API_URL: http://localhost:8081
    cmds:
      - npx vite
    interactive: true

  preview:
    desc: Start preview server
    deps: [build]
    cmds:
      - npx vite preview
    interactive: true
