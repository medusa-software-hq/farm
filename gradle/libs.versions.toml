[versions]
armeria = "1.38.0"
detekt = "1.23.8"
flyway = "11.13.0"
google-cloud-bom = "26.83.0"
grpc = "1.80.0"
grpc-kotlin = "1.5.0"
hikari = "7.0.2"
jackson = "2.19.1"
jib = "3.5.3"
kotlin = "2.3.20"
kotlin-coroutines = "1.10.2"
kotlinx-serialization = "1.9.0"
ktfmt = "0.26.0"
medusa-commons = "0.3.0"
logback = "1.5.32"
slf4j = "2.0.18"
nimbus-jose-jwt = "10.9"
nimbus-oauth2-oidc-sdk = "11.38.2"
postgresql = "42.7.8"
protobuf = "4.34.1"
protobuf-plugin = "0.10.0"
shadow = "9.4.2"
sqldelight = "2.3.2"
temporal = "1.37.0"
versionCatalogUpdate = "1.1.0"

[libraries]
armeria-bom = { module = "com.linecorp.armeria:armeria-bom", version.ref = "armeria" }
armeria-grpc = { module = "com.linecorp.armeria:armeria-grpc", version.ref = "armeria" }
armeria-grpc-kotlin = { module = "com.linecorp.armeria:armeria-grpc-kotlin", version.ref = "armeria" }
armeria-kotlin = { module = "com.linecorp.armeria:armeria-kotlin", version.ref = "armeria" }
clikt = "com.github.ajalt.clikt:clikt-jvm:5.1.0"
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
google-cloud-bom = { module = "com.google.cloud:libraries-bom", version.ref = "google-cloud-bom" }
google-cloud-secretmanager = { module = "com.google.cloud:google-cloud-secretmanager" }
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin" }
grpc-okhttp = { module = "io.grpc:grpc-okhttp", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
