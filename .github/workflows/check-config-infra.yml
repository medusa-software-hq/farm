name: Check config

on:
  workflow_call:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.14

  TF_INPUT: false
  TF_CLI_ARGS: -no-color
  NO_COLOR: 1

jobs:
  check-config:
    name: Check Terraform configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}
          # The default stdout wrapper doesn't forward piped stdin, which hangs
          # `terraform console` in the drift check below.
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v6.2.2

      - name: Check formatting
        working-directory: infra/config
        run: terraform fmt -check -recursive

      - name: Lint Terraform configuration
        working-directory: infra/config
        run: tflint --recursive

      # No cloud auth: this root is pure locals. Re-emit config.json from them and
      # fail the PR on any diff, so the committed copy can't go stale.
      - name: Check config.json is not stale
        working-directory: infra/config
        run: |
          terraform init -backend=false
          terraform validate
          echo 'jsonencode(local.config)' | terraform console | jq 'fromjson' > config.json.tmp
          mv config.json.tmp config.json
          git diff --exit-code config.json
