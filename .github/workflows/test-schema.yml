name: Test schema

# Only the schema's integration suite lives here — it needs a Postgres container, which the plain
# check-backend-impl gate deliberately doesn't set up. The shared module's formatting/lint/compile/
# unit tests run there with every other JVM module.
#
# Unlike the other integration suites this one is free and fast, so it has no change gate: the
# migrations are the one thing a rollback cannot undo, and the .sq mirror they are checked against
# is maintained by hand.

on:
  workflow_call:

permissions:
  contents: read

env:
  JAVA_VERSION: 21
  NO_COLOR: 1

jobs:
  integration-test:
    name: Integration test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers starts the database itself; the runner's own Docker is all it needs.
      - name: Integration test
        run: ./gradlew :backend:shared:integrationTest
