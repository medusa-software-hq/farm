name: Publish CLI

on:
  push:
    branches: ["trunk/*"]
    paths:
      - "cli/**"

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: 21

jobs:
  publish-cli:
    name: Publish CLI fat jar
    runs-on: ubuntu-latest

    # `environment: production` resolves vars.API_URL + the releases app id to the prod values, and
    # the secrets to prod's. The published CLI targets prod; staging use is via FARM_API_URL.
    environment: production

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fat jar
        working-directory: cli
        # Bake the per-environment OAuth client secrets into the jar (see Environment). They're
        # non-confidential for a Desktop OAuth client, but kept out of source so GitHub's push
        # protection doesn't fight us. Backend URLs + client ids are NOT baked — they're
        # deterministic public source constants. The staging secret is optional: if unset it bakes
        # empty, and `FARM_ENVIRONMENT=staging ms-farm login` reports that cleanly.
        env:
          CLI_OAUTH_CLIENT_SECRET: ${{ secrets.FARM_CLI_OAUTH_CLIENT_SECRET }}
          CLI_STAGING_OAUTH_CLIENT_SECRET: ${{ secrets.FARM_CLI_OAUTH_CLIENT_SECRET_STAGING }}
        run: |
          ./gradlew shadowJar \
            -PcliOauthClientSecret="$CLI_OAUTH_CLIENT_SECRET" \
            -PcliStagingOauthClientSecret="$CLI_STAGING_OAUTH_CLIENT_SECRET"
          echo "JAR=$GITHUB_WORKSPACE/cli/build/libs/farm-cli.jar" >> $GITHUB_ENV
          echo "VERSION=0.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.GH_RELEASES_CLIENT_ID }}
          private-key: ${{ secrets.GH_RELEASES_APP_PEM_CONTENT }}
          owner: medusa-software-hq
          repositories: farm-releases,homebrew-tap

      - name: Create a release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "${VERSION}" \
            --repo medusa-software-hq/farm-releases \
            --title "Farm CLI ${VERSION}" \
            --notes "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            "${JAR}"

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Update Homebrew formula
        working-directory: cli/tools/update-formula
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: uv run update_formula.py --version "${VERSION}" --jar "${JAR}"
