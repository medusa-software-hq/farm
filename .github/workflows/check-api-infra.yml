name: Check API infra

on:
  workflow_call:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.14

  TF_INPUT: false
  TF_CLI_ARGS: -no-color
  NO_COLOR: 1

jobs:
  check-config:
    name: Check Terraform configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}

      - uses: terraform-linters/setup-tflint@v6.2.2

      - name: Check formatting
        working-directory: backend/infra
        run: terraform fmt -check -recursive

      - name: Lint Terraform configuration
        working-directory: backend/infra
        run: tflint --recursive

      # No GCP auth / plan here on purpose: post prod/staging split the CI/CD
      # identity and project id are environment-scoped (trunk-gated), so a PR
      # can't authenticate to plan. Validate catches configuration errors; the
      # real plan+apply happens per environment on trunk (see Apply API infra).
      - name: Validate Terraform configuration
        working-directory: backend/infra
        run: |
          terraform init -backend=false
          terraform validate
