name: Apply Web app infra

on:
  push:
    branches: ["trunk/*"]
    paths:
      - "web-app/infra/foundation/**"

  workflow_dispatch:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.14

  TF_INPUT: false
  TF_CLI_ARGS: -no-color
  NO_COLOR: 1

jobs:
  apply-config:
    name: Apply Terraform (${{ matrix.environment }})
    runs-on: ubuntu-latest

    # See apply-backend-infra.yml for the environment/workspace split and the
    # staging-first promotion ordering. Production's workspace is `default` — its
    # state predates the prod/staging split.
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - environment: staging
            workspace: staging
          - environment: production
            workspace: default

    environment: ${{ matrix.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_CICD_WI_PROVIDER_NAME }}
          service_account: ${{ vars.GCP_CICD_SA_EMAIL }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}

      - name: Apply Terraform configuration
        working-directory: web-app/infra/foundation
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
        run: |
          terraform init
          terraform workspace select -or-create=true ${{ matrix.workspace }}
          terraform apply -auto-approve
