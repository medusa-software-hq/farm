name: Check claude-connector

# Only the integration suite lives here — it needs the real claude CLI (and a paid token for the
# behavioral checks), which the plain `check-backend` gate deliberately doesn't set up. The
# connector's formatting/lint/compile/unit tests run there with every other JVM module.

on:
  workflow_call:

permissions:
  contents: read

env:
  JAVA_VERSION: 21
  NO_COLOR: 1

  # The claude CLI version the connector's flag/behavior assumptions are pinned against.
  CLAUDE_CLI_VERSION: 2.1.52

jobs:
  integration-test:
    name: Integration test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CLI_VERSION }}

      # The binary alone lets the flag-surface check run; the paid behavioral checks skip themselves
      # unless CLAUDE_CODE_OAUTH_TOKEN is provisioned. --no-daemon so this invocation's token reaches
      # the forked test JVM: a reused daemon keeps its start-up environment and would drop it.
      - name: Integration test
        run: ./gradlew --no-daemon :backend:claude-connector:integrationTest
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
