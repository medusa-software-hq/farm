name: Check git-cli

on:
  workflow_call:

permissions:
  contents: read

env:
  JAVA_VERSION: 21
  NO_COLOR: 1

  SERVICE_PATH: backend/git-cli

jobs:
  check-git-cli:
    name: Check git-cli
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - uses: go-task/setup-task@v2

      - name: Check formatting
        run: task checkFormatting
        working-directory: ${{ env.SERVICE_PATH }}

      - name: Lint
        run: task lint
        working-directory: ${{ env.SERVICE_PATH }}

      - name: Compile
        run: task compile
        working-directory: ${{ env.SERVICE_PATH }}

      # The tests drive the real git binary (present on the runner) against local repositories.
      - name: Test
        run: task test
        working-directory: ${{ env.SERVICE_PATH }}
