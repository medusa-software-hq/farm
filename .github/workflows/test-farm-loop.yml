name: Test the farm loop

# The only test that can say the loop works rather than that its pieces do: one issue, filed,
# worked, reviewed, worked again, merged, against a real GitHub org and the real agent.
#
# Runs on pull requests that could break it, so a change to the farm or to the harness is tried
# before it is merged rather than after. Not a required context yet: it has never passed, and a
# check nobody has seen succeed should not be able to block a merge.
#
# One at a time. Each run makes its own repository, but the App sees every repository in the org, so
# two farms sweeping at once would each find the other's issue and work it.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: farm-loop-test
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: 21
  NO_COLOR: 1

  # The claude CLI the agent runs as, pinned as it is for the connector's own suite.
  CLAUDE_CLI_VERSION: 2.1.52

  FARM_EPHEMERAL_ORG: medusa-software-test-hq
  FARM_FIXTURE_TEMPLATE: farm-fixture-template

  # Client ids, not secrets — only the private keys are. Client ids rather than app ids because
  # that is what GitHub now asks for as a token request's issuer, and what the farm's own client
  # already signs with. The farm App does what Farm does; the fixture manager makes and drops the
  # run's repository, which is the harness's job and not Farm's.
  FARM_EPHEMERAL_APP_CLIENT_ID: Iv23livarUcAaPSh7nTl
  FIXTURE_MANAGER_APP_CLIENT_ID: Iv23li7hPF70qxLrlrNQ

jobs:
  loop-test:
    name: Loop test
    runs-on: ubuntu-latest

    services:
      # The farm's own database for this run. A container rather than a Neon branch: the semantics
      # are the same Postgres, and this needs no API key and leaves nothing behind when a run is
      # cancelled. The Neon-specific parts — pooling, cold starts, the connection string's shape —
      # are exercised by the deployment, which is a better place for them than a loop test.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: farm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      # fetch-depth: 0 so the change-detection step below can diff against the PR base.
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      # This costs a real agent run and takes minutes, and only breaks when the farm or the harness
      # around it changes — never from an infra or docs pull request. The job always runs, so its
      # result is always reported; the expensive steps run only on a relevant change.
      - name: Detect relevant changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          pattern='^(backend/|gradle/libs.versions.toml|.github/workflows/test-farm-loop.yml)'
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE "$pattern"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Nothing here could break the loop — skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-java@v4
        if: steps.changes.outputs.relevant == 'true'
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        if: steps.changes.outputs.relevant == 'true'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 22

      - name: Install the claude CLI
        if: steps.changes.outputs.relevant == 'true'
        run: npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CLI_VERSION }}

      # Temporal runs beside the farm rather than in the cloud, so a run needs no Temporal
      # credential and cannot collide with another run.
      - name: Start Temporal
        if: steps.changes.outputs.relevant == 'true'
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
          "$HOME/.temporalio/bin/temporal" server start-dev --headless --log-level error &
          for _ in $(seq 1 30); do
            if "$HOME/.temporalio/bin/temporal" operator cluster health >/dev/null 2>&1; then
              echo "Temporal is up."
              exit 0
            fi
            sleep 1
          done
          echo "Temporal did not come up." >&2
          exit 1

      # Two tokens because there are two Apps, and the split is the point: a leaked farm key cannot
      # delete a repository.
      - name: Mint the fixture manager's token
        if: steps.changes.outputs.relevant == 'true'
        id: fixture-manager
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ env.FIXTURE_MANAGER_APP_CLIENT_ID }}
          private-key: ${{ secrets.FIXTURE_MANAGER_GITHUB_APP_PEM }}
          owner: ${{ env.FARM_EPHEMERAL_ORG }}

      # Made for this run and dropped after it, so the tree the agent starts from is the same every
      # time. A shared repository would move forward with every merge and never be the same twice.
      - name: Make this run's repository
        if: steps.changes.outputs.relevant == 'true'
        id: fixture
        env:
          GH_TOKEN: ${{ steps.fixture-manager.outputs.token }}
        run: |
          name="farm-ephemeral-${{ github.run_id }}"
          gh repo create "${{ env.FARM_EPHEMERAL_ORG }}/$name" \
            --template "${{ env.FARM_EPHEMERAL_ORG }}/${{ env.FARM_FIXTURE_TEMPLATE }}" \
            --private
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Its own process, not the test's: the farm's logs stay its own, and the tests are pointed
      # at it the way they would be pointed at a deployed one.
      - name: Start the ephemeral farm
        if: steps.changes.outputs.relevant == 'true'
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/postgres?user=postgres&password=farm
          GITHUB_APP_CLIENT_ID: ${{ env.FARM_EPHEMERAL_APP_CLIENT_ID }}
          GITHUB_APP_PEM: ${{ secrets.FARM_EPHEMERAL_GITHUB_APP_PEM }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FARM_API_PORT: "8081"
        run: |
          ./gradlew --no-daemon :backend:ephemeral:installDist
          ./backend/ephemeral/build/install/ephemeral/bin/ephemeral > farm.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8081/health >/dev/null 2>&1; then
              echo "The farm is up."
              exit 0
            fi
            sleep 2
          done
          echo "The farm did not come up." >&2
          tail -50 farm.log >&2
          exit 1

      - name: Drive one issue round the loop
        if: steps.changes.outputs.relevant == 'true'
        env:
          FARM_API_HOST: localhost
          FARM_API_PORT: "8081"
          FARM_TEST_ORG: ${{ env.FARM_EPHEMERAL_ORG }}
          FARM_TEST_REPO: ${{ steps.fixture.outputs.name }}
          # The test files and reviews as the harness, not as the farm — GitHub will not let an App
          # ask for changes on a pull request it opened.
          HARNESS_APP_CLIENT_ID: ${{ env.FIXTURE_MANAGER_APP_CLIENT_ID }}
          HARNESS_APP_PEM: ${{ secrets.FIXTURE_MANAGER_GITHUB_APP_PEM }}
        run: ./gradlew --no-daemon :backend:system-tests:integrationTest

      # What the farm itself said, which is where a failure in the loop rather than in the test will
      # have left its trail.
      - name: The farm's log
        if: always() && steps.changes.outputs.relevant == 'true'
        run: tail -200 farm.log || true

      # Whatever happened above, including the run being cancelled. The name comes from the run id
      # rather than from a step's output, so this works even if the repository step is what failed.
      # Runs however the job ended, cancellation included — which is when a repository is most
      # likely to be left behind.
      - name: Drop this run's repository
        if: always() && steps.changes.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ steps.fixture-manager.outputs.token }}
        run: |
          name="farm-ephemeral-${{ github.run_id }}"
          gh repo delete "${{ env.FARM_EPHEMERAL_ORG }}/$name" --yes || \
            echo "Nothing to drop: $name was never made."
