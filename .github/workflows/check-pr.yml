name: Check PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-workflows:
    name: Workflows
    uses: ./.github/workflows/check-workflows.yml

  check-infra:
    name: Infra (root)
    uses: ./.github/workflows/check-infra.yml

  check-config-infra:
    name: Config
    uses: ./.github/workflows/check-config-infra.yml

  check-web-app-infra:
    name: Web app (infra)
    uses: ./.github/workflows/check-web-app-infra.yml

  check-web-app-domain-mapping:
    name: Web app (domain mapping)
    uses: ./.github/workflows/check-web-app-domain-mapping.yml

  check-web-app-impl:
    name: Web app (implementation)
    uses: ./.github/workflows/check-web-app-impl.yml

  # backend/infra provisions shared backend infrastructure — the Neon database (used by the API and
  # the worker), the app-pem/database-url secrets, the service account — not anything API-specific.
  check-backend-infra:
    name: Backend (infra)
    uses: ./.github/workflows/check-backend-infra.yml

  check-api-domain-mapping:
    name: API (domain mapping)
    uses: ./.github/workflows/check-api-domain-mapping.yml

  # One gate for every JVM module (api, shared, github-client, worker, git-cli, cli, and the
  # connector's unit tests) — formatting, lint, and the full test suite.
  check-backend-impl:
    name: Backend (implementation)
    uses: ./.github/workflows/check-backend-impl.yml

  # The connector's real-CLI integration suite only — a test job, not a full check (its
  # formatting/lint/compile/unit tests run in check-backend-impl with the other JVM modules).
  test-claude-connector:
    name: claude-connector
    uses: ./.github/workflows/test-claude-connector.yml
    # For the real-CLI integration suite's CLAUDE_CODE_OAUTH_TOKEN (paid checks skip without it).
    secrets: inherit

  # The run summarizer's real-model integration suite only — a test job, not a full check (its
  # formatting/lint/compile/unit tests run in check-backend-impl with the other JVM modules).
  test-run-summary:
    name: run-summary
    uses: ./.github/workflows/test-run-summary.yml
    # For the real-model integration suite's OPENROUTER_API_KEY (paid checks skip without it).
    secrets: inherit

  # The migrations and the stores over them, against a real Postgres — a test job, not a full check
  # (the shared module's formatting/lint/compile/unit tests run in check-backend-impl). Needs no
  # secrets: Testcontainers starts its own database.
  test-schema:
    name: schema
    uses: ./.github/workflows/test-schema.yml
