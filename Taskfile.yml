version: '3'

includes:
  infra:
    taskfile: infra/Taskfile.yml
    dir: infra

  config:
    taskfile: infra/config/Taskfile.yml
    dir: infra/config

  web:app:
    taskfile: web-app/Taskfile.yml
    dir: web-app

  web:infra:
    taskfile: web-app/infra/foundation/Taskfile.yml
    dir: web-app/infra/foundation

  web:domain-mapping:
    taskfile: web-app/infra/domain-mapping/Taskfile.yml
    dir: web-app/infra/domain-mapping

  gradleRoot:
    taskfile: gradle-root.Taskfile.yml
    dir: .

  api:infra:
    taskfile: backend/infra/Taskfile.yml
    dir: backend/infra

  api:domain-mapping:
    taskfile: backend/infra/domain-mapping/Taskfile.yml
    dir: backend/infra/domain-mapping

  cli:
    taskfile: cli/Taskfile.yml
    dir: cli

tasks:
  github-ci:lint:
    desc: Lint GitHub workflows
    sources:
      - '.github/workflows/*.yml'
    cmds:
      - github-ci lint

  github-ci:fixLint:
    desc: Fix lint issues in GitHub workflows
    sources:
      - '.github/workflows/*.yml'
    cmds:
      - github-ci lint --fix

  github-ci:upgrade:
    desc: Upgrade GitHub workflow actions to the latest versions
    cmds:
      - github-ci upgrade

  checkFormatting-all:
    desc: Check formatting for the entire codebase
    deps:
      - github-ci:lint
      - gradleRoot:checkFormatting
      - infra:checkFormatting
      - config:checkFormatting
      - web:app:checkFormatting
      - web:infra:checkFormatting
      - web:domain-mapping:checkFormatting
      - api:infra:checkFormatting
      - api:domain-mapping:checkFormatting

  fixFormatting-all:
    desc: Fix formatting for the entire codebase
    deps:
      - github-ci:fixLint
      - gradleRoot:fixFormatting
      - infra:fixFormatting
      - config:fixFormatting
      - web:app:fixFormatting
      - web:infra:fixFormatting
      - web:domain-mapping:fixFormatting
      - api:infra:fixFormatting
      - api:domain-mapping:fixFormatting

  lint-all:
    desc: Lint the entire codebase
    deps:
      - github-ci:lint
      - gradleRoot:lint
      - infra:lint
      - config:lint
      - web:app:lint
      - web:infra:lint
      - web:domain-mapping:lint
      - api:infra:lint
      - api:domain-mapping:lint

  analyze-all:
    desc: Analyze the entire codebase
    deps:
      - config:check
      - infra:validate
      - web:app:analyze
      - web:infra:validate
      - web:domain-mapping:validate
      - api:infra:validate
      - api:domain-mapping:validate
      - gradleRoot:compile
      - gradleRoot:test

  worker:run:
    desc: Run the worker on its own (env-configured; requires a reachable Postgres and Temporal)
    cmds:
      - ./gradlew :backend:worker:proper:run
    interactive: true

  dev:
    desc: Run the full local stack — the local backend (with its Temporal dev server) and the frontend
    deps:
      - backend:local
      - web:app:run

  fetch-dev-github-key:
    desc: Fetch the Test GitHub App private key so backend:local can talk to real GitHub
    vars:
      KEY_PATH: '{{.HOME}}/.config/ms-farm/dev-github-app.pem'
    status:
      - test -f {{.KEY_PATH}}
    cmds:
      - mkdir -p {{.HOME}}/.config/ms-farm
      - gcloud secrets versions access latest --secret main-dev-github-app-pem --project ms-farm-shared-c83577a8 > {{.KEY_PATH}}
      - chmod 600 {{.KEY_PATH}}

  temporal:dev:
    # Needs the `temporal` CLI on PATH (https://docs.temporal.io/cli).
    desc: Run a local Temporal dev server (skipped if one is already listening on :7233)
    status:
      - nc -z localhost 7233
    cmds:
      - temporal server start-dev

  backend:local:
    desc: Run the one-process local backend (API + in-process worker) with its Temporal dev server
    deps:
      - temporal:dev
      - backend:local:app

  backend:local:app:
    internal: true
    deps:
      - fetch-dev-github-key
    # The worker connects to Temporal eagerly, so wait for it (started in parallel) before booting.
    cmds:
      - for i in $(seq 1 100); do nc -z localhost 7233 && exit 0; sleep 0.2; done; echo "Temporal dev server not ready on :7233" >&2; exit 1
      - ./gradlew :backend:local:run
    interactive: true
