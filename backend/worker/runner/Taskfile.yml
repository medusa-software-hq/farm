version: '3'

.kotlinSources: &kotlinSources
  - '**/*.kt'
  - '**/*.kts'

tasks:
  checkFormatting:
    desc: Check Kotlin formatting
    sources: *kotlinSources
    cmds:
      - ../../../gradlew ktfmtCheck

  fixFormatting:
    desc: Fix Kotlin formatting
    sources: *kotlinSources
    cmds:
      - ../../../gradlew ktfmtFormat

  lint:
    desc: Lint the Kotlin sources
    sources: *kotlinSources
    cmds:
      - ../../../gradlew detekt

  compile:
    desc: Compile the Kotlin sources
    sources: *kotlinSources
    cmds:
      - ../../../gradlew :backend:worker:runner:compileKotlin

  install:
    # No Task-level `sources`/`generates` fingerprint: it can only see this module's files, so a
    # change in a dependency module (worker:core, backend:shared) wouldn't invalidate it and the
    # installed binary would silently go stale. Always invoke Gradle and let its cross-module
    # up-to-date check decide whether to actually rebuild.
    desc: Install the runner locally (build/install/runner/bin/runner)
    cmds:
      - ../../../gradlew :backend:worker:runner:installDist

  run:
    desc: Run the runner against a remote DB. Pass ENVIRONMENT=prod|staging (default prod).
    deps: [install]
    env:
      FARM_RUNNER_ENVIRONMENT: '{{.ENVIRONMENT | default "prod"}}'
    cmds:
      - ./bin/ms-farm-runner
    interactive: true
